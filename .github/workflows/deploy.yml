# What happens on every push to main:
#   1. Build the app (catches code errors before anything goes live)
#   2. Set up the Neon database (only creates tables the first time - never wipes data)
#   3. Test the two APIs on a local copy, with no screens at all
#   4. Deploy to Vercel and give the live site its DATABASE_URL
#   5. Try to break the live site with a rating of 500 - it must be rejected
name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: |
          if ! npm run build > build.log 2>&1; then
            grep -E "Type error|Error:|error TS|Failed to compile|Module not found|\.tsx?:[0-9]+" build.log | head -10 | while IFS= read -r line; do
              echo "::error title=Build failed::$line"
            done
            cat build.log; exit 1
          fi
          tail -40 build.log

      - name: Check secrets are set (never prints their values)
        run: |
          ok=true
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL secret is missing or empty"; ok=false
          elif [[ "$DATABASE_URL" == DATABASE_URL=* ]]; then echo "::error::DATABASE_URL secret starts with 'DATABASE_URL=' - paste only the part starting postgresql://"; ok=false
          elif [[ "$DATABASE_URL" != postgres* ]]; then echo "::error::DATABASE_URL secret does not start with postgresql:// (starts with '${DATABASE_URL:0:6}...')"; ok=false
          fi
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret is missing or empty"; ok=false; fi
          $ok

      - name: Set up database
        id: db
        run: npm run db:setup

      - name: Test the APIs locally (no UI)
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:3000 > /dev/null && break; sleep 1; done
          show() { echo; echo "\$ $1"; echo "$2"; }
          post() { curl -s -w "  [HTTP %{http_code}]" -X POST localhost:3000/api/reviews -H "Content-Type: application/json" -d "$1"; }

          show "GET /api/restaurants/1"   "$(curl -s -w '  [HTTP %{http_code}]' localhost:3000/api/restaurants/1)"
          show "GET /api/restaurants?city=2&q=biryani" "$(curl -s -w '  [HTTP %{http_code}]' 'localhost:3000/api/restaurants?city=2&q=biryani' | head -c 600)"
          show "POST /api/cart without logging in" "$(curl -s -w '  [HTTP %{http_code}]' -X POST localhost:3000/api/cart -H 'Content-Type: application/json' -d '{"menuItemId":1,"change":1}')"
          show "POST /api/auth/login with wrong OTP" "$(curl -s -w '  [HTTP %{http_code}]' -X POST localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"name":"Test","phone":"9876543210","otp":"0000"}')"
          show "GET /api/restaurants/999" "$(curl -s -w '  [HTTP %{http_code}]' localhost:3000/api/restaurants/999)"
          if [ "${{ steps.db.outputs.seeded }}" = "true" ]; then
            show "POST rating 5, 'Great'" "$(post '{"restaurantId":1,"rating":5,"comment":"Great"}')"
          fi
          show "POST rating 500"        "$(post '{"restaurantId":1,"rating":500,"comment":"Great"}')"
          show "POST empty comment"     "$(post '{"restaurantId":1,"rating":4,"comment":"   "}')"
          show "POST restaurant 999"    "$(post '{"restaurantId":999,"rating":4,"comment":"Great"}')"
          show "GET /api/restaurants/1 (again - average recomputed, nobody updated it)" "$(curl -s localhost:3000/api/restaurants/1)"

          # Fail the run if the bad requests were not rejected.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/reviews -H 'Content-Type: application/json' -d '{"restaurantId":1,"rating":500,"comment":"x"}')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/restaurants/999)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3000/api/restaurants?city=1')" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/api/cart -H 'Content-Type: application/json' -d '{"menuItemId":1,"change":1}')" = "401"

      - name: Deploy to Vercel
        id: deploy
        run: |
          # Run a command; if it fails, show its last lines as a readable error note.
          step() {
            local label="$1"; shift
            if ! "$@" > out.txt 2>&1; then
              echo "::error title=$label failed::$(tail -n 8 out.txt | sed 's/%/%25/g' | tr '\n' ' ')"
              cat out.txt; exit 1
            fi
            cat out.txt
          }
          npm install -g vercel@latest > /dev/null 2>&1
          step "Vercel login check" vercel whoami --token "$VERCEL_TOKEN"
          step "Vercel link" vercel link --yes --project zomato-lite --token "$VERCEL_TOKEN"
          vercel env rm DATABASE_URL production --yes --token "$VERCEL_TOKEN" > /dev/null 2>&1 || true
          printf '%s' "$DATABASE_URL" > dburl.txt
          step "Vercel env add" sh -c 'vercel env add DATABASE_URL production --token "$VERCEL_TOKEN" < dburl.txt'
          rm dburl.txt
          step "Vercel deploy" vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          PROJECT_ID=$(jq -r .projectId .vercel/project.json)
          ORG_ID=$(jq -r .orgId .vercel/project.json)
          DOMAIN=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$ORG_ID" \
            | jq -r '[.targets.production.alias[]? | select(endswith(".vercel.app"))] | sort_by(length) | .[0] // empty')
          echo "::notice title=Live URL::https://$DOMAIN"
          echo "url=https://$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Break it on purpose (against the live site)
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "\$ GET $URL/api/restaurants/1"
          curl -s -w "  [HTTP %{http_code}]\n" "$URL/api/restaurants/1"
          echo "\$ POST $URL/api/reviews  rating=500 comment=hacked"
          CODE=$(curl -s -o body.txt -w '%{http_code}' -X POST "$URL/api/reviews" \
            -H "Content-Type: application/json" \
            -d '{"restaurantId":1,"rating":500,"comment":"hacked"}')
          cat body.txt; echo "  [HTTP $CODE]"
          echo "::notice title=Rating 500 on live site::HTTP $CODE $(cat body.txt)"
          test "$CODE" = "400"
          {
            echo "## Live at $URL"
            echo "- Restaurant page: $URL/restaurant/1"
            echo "- Write a review: $URL/review/1"
            echo "- Rating 500 on production: HTTP $CODE, $(cat body.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
